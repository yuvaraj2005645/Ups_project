<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FleetOps Logo">
  <defs>
    <!-- Dark navy rounded-square background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <!-- Blue accent gradient for the truck body -->
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <!-- Green accent for the route/checkmark element -->
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>

  <!-- Subtle inner glow ring -->
  <rect width="64" height="64" rx="14" ry="14" fill="none"
        stroke="#3B82F6" stroke-width="1" opacity="0.25"/>

  <!-- ── Delivery truck body ── -->
  <!-- Main cargo box -->
  <rect x="8" y="20" width="30" height="22" rx="3" ry="3" fill="url(#blue)"/>

  <!-- Cab (front section) -->
  <path d="M38 25 L38 42 L56 42 L56 32 Q56 25 50 25 Z" fill="#2563EB"/>

  <!-- Cab windscreen -->
  <path d="M40 26 L40 33 L54 33 L54 29 Q52 26 48 26 Z" fill="#BAE6FD" opacity="0.9"/>

  <!-- Side stripe on cargo box -->
  <rect x="8" y="20" width="30" height="4" rx="2" ry="2" fill="#1D4ED8" opacity="0.6"/>

  <!-- ── Wheels ── -->
  <!-- Rear wheel -->
  <circle cx="20" cy="43" r="6" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="20" cy="43" r="3" fill="#CBD5E1"/>

  <!-- Front wheel -->
  <circle cx="47" cy="43" r="6" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="47" cy="43" r="3" fill="#CBD5E1"/>

  <!-- ── Route path / speed lines (green accent) ── -->
  <line x1="11" y1="27" x2="11" y2="38" stroke="#34D399" stroke-width="1.5"
        stroke-linecap="round" opacity="0.7"/>
  <line x1="15" y1="27" x2="15" y2="38" stroke="#34D399" stroke-width="1"
        stroke-linecap="round" opacity="0.4"/>

  <!-- ── Checkmark / on-time delivery badge (top right) ── -->
  <circle cx="52" cy="16" r="8" fill="url(#green)"/>
  <polyline points="47,16 50.5,19.5 57,13"
            fill="none" stroke="white" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
